version: "3.9"

services:
  backend:
    build:
      context: ./backend
    image: edwad148/schoolmsapp-backend:latest
    container_name: backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    env_file:
      - .env.backend
    expose:
      - "8000"

  # Executes queued tasks, with the CELERY_BEAT_SCHEDULE scheduler embedded via
  # --beat. Without this running, CELERY_WORKER_AVAILABLE must stay unset: the
  # gate scan path deliberately refuses to send notifications inline, so parents
  # would get in-app alerts and nothing else.
  #
  # Embedded beat means exactly ONE replica of this service. Scale it and every
  # replica runs its own scheduler, so each periodic task fires once per replica.
  # If you ever need more than one worker, drop --beat here and add a separate
  # `celery -A config beat` service instead.
  celery:
    build:
      context: ./backend
    image: edwad148/schoolmsapp-backend:latest
    container_name: celery
    command: celery -A config worker --beat --loglevel=info --pool=threads --concurrency=4
    env_file:
      - .env.backend
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      # Vite inlines VITE_* at build time, so these must be present when the
      # image is built — not at run time. Compose reads them from the shell or
      # from the .env file beside this compose file. VITE_API_URL aborts the
      # build if missing: unset, the bundle silently falls back to
      # http://localhost:8000 and authentication breaks in production.
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL before building}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET}
        VITE_PAYSTACK_PUBLIC_KEY: ${VITE_PAYSTACK_PUBLIC_KEY}
    image: edwad148/schoolmsapp-frontend:latest
    container_name: frontend
    command: ["nginx", "-g", "daemon off;"]
    # This container's nginx proxies /api to http://backend:8000 and resolves
    # that name once, at startup. If it wins the startup race the name does not
    # resolve yet and nginx exits with "host not found in upstream", leaving the
    # frontend to crash-loop while the rest of the stack looks healthy.
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
