<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuventa Cloud</title>
    <meta name="description" content="Smarter Schools. Stronger Futures. — The all-in-one cloud school management platform." />

    <!-- Favicon (overridden at runtime by FaviconUpdater) -->
    <link rel="icon" type="image/png" href="/images/nuventa-favicon.png" />
    <link rel="apple-touch-icon" href="/images/nuventa-favicon.png" />

    <!-- Open Graph (overridden at runtime by MetaTagManager for tenant domains) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nuventa Cloud" />
    <meta property="og:title" content="Nuventa Cloud — Smarter Schools. Stronger Futures." />
    <meta property="og:description" content="The all-in-one cloud school management platform built for modern schools." />
    <meta property="og:image" content="https://www.nuventacloud.com/images/nuventa-logo.png" />
    <meta property="og:url" content="https://www.nuventacloud.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nuventa Cloud — Smarter Schools. Stronger Futures." />
    <meta name="twitter:description" content="The all-in-one cloud school management platform built for modern schools." />
    <meta name="twitter:image" content="https://www.nuventacloud.com/images/nuventa-logo.png" />

    <!-- Meta Pixel -->
    <!--
      Inline and host-guarded on purpose.

      Nuventa serves one SPA build from the marketing site, tenant subdomains
      and tenant custom domains, so an unguarded snippet here would track
      schoolchildren and staff using their own school's portal. The guard keeps
      that from happening while still letting the pixel fire immediately.

      It has to be inline rather than in the bundle: loaded from React it did
      not reach Meta until ~5s (bundle, then awaited i18n init, then mount,
      then auth hydration), so fast bounces on paid traffic went uncounted and
      Meta's Event Setup Tool could not see a pixel in the page source at all.

      Keep HOSTS and the id in step with src/utils/metaPixel.ts, which still
      owns route-change PageViews and conversion events.
    -->
    <script>
      (function () {
        var HOSTS = ['nuventacloud.com', 'www.nuventacloud.com'];
        if (HOSTS.indexOf(window.location.hostname.toLowerCase()) === -1) return;

        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');

        fbq('init', '1644900083720955');
        fbq('track', 'PageView');

        // Tells <MetaPixel /> the first PageView is already sent, so it starts
        // reporting from the first client-side navigation instead of doubling
        // up on the landing page.
        window.__nuventaPixelBootstrapped = true;
      })();
    </script>

    <!-- Prevent white flash -->
    <style>
      body {
        margin: 0;
        background: #0f172a; /* match your theme */
      }
      #loader {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: system-ui, sans-serif;
        font-size: 18px;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loader">Loading…</div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
