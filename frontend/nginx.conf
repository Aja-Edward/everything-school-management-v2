server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Docker's embedded DNS.
    #
    # nginx resolves a literal upstream name once, at startup, and caches the
    # address for the life of the process. Two consequences: the container dies
    # at boot if the name is not resolvable yet, and a backend recreated on a
    # new IP keeps receiving traffic at the stale address until the frontend is
    # restarted too. Putting the upstream in a variable defers resolution to
    # request time, where valid= applies as a TTL.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API requests to backend
    location /api {
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy media requests to backend
    location /media/ {
        set $media_upstream http://backend:8000;
        proxy_pass $media_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle React Router - this is the key fix
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Add cache-busting for JavaScript files
    location ~* \.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }
}
